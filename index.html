<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Branding & Theme Tags -->
    <title>NutriFlow AI — Diet, Hydration & Exercises</title>
    <meta name="description" content="Elegant AI-powered personal diet, hydration, and exercise workspace" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141923" />
    
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriFlow" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/gradient/512/ffffff/flame.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("NutriFlow Service Worker registered successfully:", reg.scope))
            .catch((err) => console.log("NutriFlow Service Worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
