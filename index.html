<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Branding & Theme Tags -->
    <title>NutriFlow AI — Diet, Hydration & Exercises</title>
    <meta name="description" content="Elegant AI-powered personal diet, hydration, and exercise workspace" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141923" />
    
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriFlow" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- Branded boot splash: shown instantly (before the JS bundle loads) and
         automatically replaced when React mounts into #root. Prevents the blank
         dark/white flash on startup. Inline styles so it needs no CSS bundle. -->
    <style>
      html, body { margin: 0; background: #0B0E14; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0B0E14;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      #boot-splash .mark {
        width: 72px; height: 72px; border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        background: linear-gradient(to top right, #6366F1, #a855f7);
        box-shadow: 0 18px 40px -10px rgba(99,102,241,0.55);
        animation: bootPulse 1.8s ease-in-out infinite;
      }
      #boot-splash .word { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; color: #fff; }
      #boot-splash .word span { color: #818CF8; }
      #boot-splash .bar { width: 96px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
      #boot-splash .bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: 999px;
        background: linear-gradient(to right, #6366F1, #a855f7);
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      @keyframes bootPulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .92; } }
      @keyframes bootSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="mark">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
          </svg>
        </div>
        <div class="word">Nutri<span>Flow</span></div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Clean up Service Workers to avoid stale iframe caches -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log("Unregistered stale service worker successfully");
            });
          }
        });
      }
    </script>
  </body>
</html>
