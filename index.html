<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Branding & Theme Tags -->
    <title>NutriFlow AI — Diet, Hydration & Exercises</title>
    <meta name="description" content="Elegant AI-powered personal diet, hydration, and exercise workspace" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141923" />
    
    <!-- iOS Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriFlow" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Clean up Service Workers to avoid stale iframe caches -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log("Unregistered stale service worker successfully");
            });
          }
        });
      }
    </script>
  </body>
</html>
